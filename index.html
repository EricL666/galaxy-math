<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星星數學宇宙</title>
<style>
:root{--ink:#2b2350;--pink:#ff7eb6;--yellow:#ffd84d;--mint:#5fe3c0;--sky:#7cc8ff;--violet:#a78bfa;--card:#fffaf3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1033;color:#fff;overflow:hidden;user-select:none;
 font-family:"jf open 粉圓","Microsoft JhengHei UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
#sky{position:fixed;inset:0;z-index:0}
.screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;padding:14px 16px 40px}
.screen.on{display:flex}
button{font-family:inherit;cursor:pointer;border:0}
.bar{width:100%;max-width:1200px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .sp{flex:1}
.pill{background:#ffffff22;border:2px solid #ffffff44;border-radius:999px;padding:8px 16px;font-size:20px;font-weight:700;color:#fff;display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(4px)}
.pill.btn:hover{background:#ffffff38;transform:translateY(-2px)}
.pill.btn{transition:.15s}
.wallet{background:linear-gradient(#ffe680,#ffb938);color:#6b3b00;border-color:#fff3}
h1.title{margin:6px 0 2px;font-size:clamp(30px,5vw,54px);letter-spacing:4px;text-shadow:0 0 18px #a78bfa,0 3px 0 #5b3fb8}
.sub{opacity:.85;margin:0 0 14px;font-size:18px}
/* constellation grid */
.cgrid{width:100%;max-width:1200px;display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.ccard{background:linear-gradient(160deg,#ffffff1f,#ffffff08);border:2px solid #ffffff2a;border-radius:22px;padding:10px 12px 12px;color:#fff;text-align:left;transition:.18s;position:relative}
.ccard:hover{transform:translateY(-4px) scale(1.02);border-color:var(--h);box-shadow:0 0 22px var(--h)}
.ccard svg{width:100%;height:110px;display:block}
.ccard .nm{font-size:22px;font-weight:800}
.ccard .tp{font-size:16px;opacity:.9;margin-top:2px}
.ccard .gr{position:absolute;top:10px;right:10px;font-size:13px;background:#0006;border-radius:999px;padding:3px 9px}
.ccard .pg{display:flex;justify-content:space-between;margin-top:6px;font-size:15px}
.meter{height:8px;background:#ffffff22;border-radius:9px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--pink))}
/* planets path */
.chead{text-align:center;margin:4px 0 0}
.chead .nm{font-size:clamp(28px,4vw,44px);font-weight:900;text-shadow:0 0 16px var(--h)}
.chead .tp{font-size:20px;opacity:.9}
.path{position:relative;width:min(1150px,96vw);height:min(560px,68vh);min-height:420px;margin-top:6px}
.path svg.trail{position:absolute;inset:0;width:100%;height:100%}
.pl{position:absolute;transform:translate(-50%,-50%);background:none;color:#fff;text-align:center;width:118px;transition:.2s}
.pl .ball{width:96px;height:96px;margin:0 auto;position:relative}
.pl .ball svg{width:100%;height:100%;filter:drop-shadow(0 0 10px #fff6)}
.pl:hover:not(.lock){transform:translate(-50%,-50%) scale(1.12)}
.pl.lock .ball svg{filter:grayscale(1) brightness(.45)}
.pl.lock{cursor:not-allowed}
.pl .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px}
.pl .no{position:absolute;left:-4px;top:-4px;background:#fff;color:var(--ink);font-weight:900;border-radius:50%;width:30px;height:30px;line-height:30px;font-size:17px;box-shadow:0 2px 0 #0004}
.pl .tag{display:inline-block;margin-top:2px;font-size:13px;border-radius:999px;padding:2px 9px;font-weight:700;color:#2b2350}
.pl .st{font-size:15px;margin-top:2px;white-space:nowrap}
.pl .srow{display:flex;justify-content:center;gap:1px;margin-top:3px}
.pl .srow svg{width:11px;height:11px}
.pl .sfr{display:inline-flex;align-items:center;gap:4px;margin-top:2px;font-size:16px;font-weight:900;background:#0007;border-radius:999px;padding:1px 10px}
.pl .sfr .fr{font-size:14px;margin:0}
.pl .sfr .fr b{border-bottom-width:2px}
.pl.next .ball{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-9px)}}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px;font-size:15px}
.legend span{border-radius:999px;padding:3px 12px;color:#2b2350;font-weight:700}
/* quiz */
.qwrap{width:100%;max-width:1000px;display:flex;flex-direction:column;align-items:center}
.dots{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap;justify-content:center}
.dots i{width:34px;height:34px;border-radius:50%;background:#ffffff22;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:19px;border:2px solid transparent}
.dots i.cur{border-color:#fff;box-shadow:0 0 10px #fff}
.qcard{width:100%;background:var(--card);color:var(--ink);border-radius:30px;padding:22px 24px 26px;box-shadow:0 10px 0 #0003,0 0 40px #a78bfa55;position:relative}
.qtop{display:flex;align-items:flex-start;gap:12px}
.qt{flex:1;font-size:clamp(24px,3.2vw,36px);font-weight:800;line-height:1.45}
.spk{background:var(--sky);color:#fff;font-size:26px;width:56px;height:56px;border-radius:50%;flex:none;box-shadow:0 4px 0 #3b8fd0}
.spk:active{transform:translateY(3px);box-shadow:0 1px 0 #3b8fd0}
.qv{display:flex;justify-content:center;align-items:center;margin:12px 0 4px;min-height:10px;flex-wrap:wrap;gap:14px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{min-height:84px;border-radius:22px;font-size:clamp(24px,3vw,34px);font-weight:900;color:var(--ink);padding:8px;display:flex;align-items:center;justify-content:center;gap:6px;transition:.12s;box-shadow:0 6px 0 #0002}
.opt:nth-child(1){background:#ffe0ec}.opt:nth-child(2){background:#dff3ff}.opt:nth-child(3){background:#e6ffe9}.opt:nth-child(4){background:#fff3c9}
.opt:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 9px 0 #0002}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #0002}
.opt.wrong{background:#ddd!important;color:#999;animation:shake .4s;text-decoration:line-through}
.opt.right{background:#7ef0b8!important;box-shadow:0 0 0 5px #fff,0 0 24px #3ddc97;animation:pop .45s}
.opt svg{width:70px;height:70px}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes pop{50%{transform:scale(1.1)}}
.hint{display:none;align-items:center;gap:10px;margin-top:16px;background:#fff1c1;border-radius:20px;padding:10px 16px;font-size:clamp(18px,2.2vw,23px);font-weight:700;color:#7a4a00;border:3px dashed #ffc93c}
.hint.on{display:flex;animation:pop .4s}
.hint svg{width:58px;height:58px;flex:none}
/* visuals */
.emos{display:flex;flex-wrap:wrap;justify-content:center;max-width:640px;font-size:clamp(30px,4vw,42px);gap:2px 6px;line-height:1.2}
.emos i{font-style:normal}
.emos i.gone{opacity:.25;position:relative}
.emos i.gone::after{content:"✕";position:absolute;left:0;right:0;top:-4px;color:#ff4f6d;font-size:.95em;font-weight:900;text-align:center}
.emos .op{font-style:normal;font-weight:900;color:var(--pink);margin:0 10px}
.box2{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.box2>div{border:3px dashed #c9b8ff;border-radius:18px;padding:8px 12px;min-width:150px}
.box2 b{display:block;text-align:center;font-size:18px;color:#8a76d6}
.groups{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.plate{background:#fff;border:4px solid #ffc3d9;border-radius:50%;width:112px;height:112px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;font-size:27px;padding:8px;line-height:1.1}
.seq{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.seq b{background:#efe9ff;border-radius:14px;padding:6px 14px;font-size:clamp(26px,3.4vw,38px)}
.seq em{font-style:normal;color:#bbb;font-size:28px}
.qm{color:var(--pink)!important;background:#ffe6f1!important;border:3px dashed var(--pink)}
.vert{font-family:Consolas,"Courier New",monospace;font-size:44px;font-weight:900;text-align:right;line-height:1.2;background:#f4f0ff;border-radius:18px;padding:8px 22px}
.vert span{float:left;margin-right:16px;color:var(--pink)}
.vert hr{border:0;border-top:4px solid var(--ink);margin:4px 0}
.vert .qm{background:none!important;border:0;text-align:center}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 4px;font-weight:900}
.fr b{border-bottom:3px solid currentColor;padding:0 4px 2px}
.fr i{font-style:normal;padding-top:2px}
.coins{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;max-width:640px}
.coin{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#5a3d00;box-shadow:inset 0 -4px 0 #0002,0 3px 0 #0003;border:3px solid #fff8}
.c1{width:44px;height:44px;background:radial-gradient(circle at 35% 30%,#ffe7a8,#d29a3a);font-size:18px}
.c5{width:52px;height:52px;background:radial-gradient(circle at 35% 30%,#ffffff,#a9b0bd);font-size:20px;color:#444}
.c10{width:58px;height:58px;background:radial-gradient(circle at 35% 30%,#fff,#b8bfcb);font-size:20px;color:#444;border-color:#e7c35e}
.c50{width:64px;height:64px;background:radial-gradient(circle at 35% 30%,#fff2b3,#e0a826);font-size:22px}
.bill{width:118px;height:58px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:22px;box-shadow:0 3px 0 #0003;border:3px solid #fff6}
.b100{background:linear-gradient(135deg,#ff8a80,#d84343)}.b500{background:linear-gradient(135deg,#c9a27a,#8b5a2b)}.b1000{background:linear-gradient(135deg,#7fb3ff,#3561c9)}
.tb{border-collapse:collapse;font-size:24px;background:#fff;border-radius:12px;overflow:hidden}
.tb td,.tb th{border:2px solid #d8ccff;padding:6px 16px;text-align:center}
.tb th{background:#efe9ff}
.posg{border-collapse:separate;border-spacing:4px}
.posg td{width:58px;height:58px;background:#eef6ff;border-radius:10px;text-align:center;font-size:34px}
.vsvg{max-width:100%;height:auto}
.bigeq{font-size:44px;font-weight:900}
/* result */
.rcard{background:var(--card);color:var(--ink);border-radius:30px;padding:24px 30px;max-width:640px;width:100%;text-align:center;margin-top:20px;box-shadow:0 10px 0 #0003}
.rstars{font-size:40px;letter-spacing:2px;margin:10px 0}
.rstars i{font-style:normal;display:inline-block;animation:pop .5s backwards}
.bigbadge{width:190px;height:190px;margin:4px auto;animation:spinin 1s}
@keyframes spinin{from{transform:scale(0) rotate(-200deg)}}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.bigbtn{font-size:24px;font-weight:900;padding:14px 26px;border-radius:20px;color:#fff;background:var(--pink);box-shadow:0 6px 0 #c24a83}
.bigbtn.b2{background:var(--sky);box-shadow:0 6px 0 #3b8fd0}
.bigbtn.b3{background:#9c8cf0;box-shadow:0 6px 0 #6a58c7}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #0003}
.bigbtn:disabled{filter:grayscale(1);opacity:.6;cursor:not-allowed}
/* album & shop */
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.tab{font-size:19px;font-weight:800;padding:9px 16px;border-radius:999px;background:#ffffff1f;color:#fff;border:2px solid #ffffff33}
.tab.on{background:#fff;color:var(--ink)}
.panel{width:100%;max-width:1150px}
.sect{background:#ffffff14;border:2px solid #ffffff22;border-radius:22px;padding:10px 14px;margin-bottom:12px}
.sect h3{margin:2px 0 8px;font-size:21px;display:flex;align-items:center;gap:8px}
.sect h3 small{font-weight:400;opacity:.8;font-size:15px}
.brow{display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.bslot{aspect-ratio:1;border-radius:50%;background:#ffffff10;position:relative;padding:0}
.bslot svg{width:100%;height:100%}
.bslot.no svg{filter:grayscale(1) brightness(.35) opacity(.6)}
.bslot.no::after{content:"?";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#fff9}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.sitem{background:var(--card);color:var(--ink);border-radius:22px;padding:12px;text-align:center;position:relative;box-shadow:0 6px 0 #0003}
.sitem .art{width:110px;height:110px;margin:0 auto}
.sitem .art svg{width:100%;height:100%}
.sitem .nm{font-weight:800;font-size:18px;margin:4px 0 6px;min-height:24px}
.buy{font-size:19px;font-weight:900;border-radius:14px;padding:8px 14px;background:linear-gradient(#ffe680,#ffb938);color:#6b3b00;box-shadow:0 4px 0 #c98a17}
.buy:disabled{background:#e4e4e4;color:#888;box-shadow:0 4px 0 #bbb;cursor:not-allowed}
.owned{font-size:18px;font-weight:900;color:#1f9d6a}
.sitem.have{outline:4px solid #7ef0b8}
/* modal */
#modal{position:fixed;inset:0;background:#0009;z-index:9;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
#modal .mbox{background:var(--card);color:var(--ink);border-radius:28px;padding:22px 26px;max-width:520px;width:100%;text-align:center;animation:pop .3s;max-height:90vh;overflow:auto}
#modal .mbox p{font-size:20px;line-height:1.6;text-align:left}
.fly{position:fixed;z-index:20;font-size:44px;pointer-events:none;transition:all .9s cubic-bezier(.5,-0.4,.7,1)}
.confetti{position:fixed;z-index:19;pointer-events:none;width:12px;height:12px;border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.7}}
#splash{text-align:center;justify-content:center}
#splash .mas{width:200px;height:200px;animation:bob 1.6s ease-in-out infinite}
@media (max-width:700px){.brow{grid-template-columns:repeat(5,1fr)}.opts.three{grid-template-columns:1fr}.pl{width:84px}.pl .ball{width:64px;height:64px}.pl .tag{display:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<section class="screen on" id="splash">
  <div class="mas" id="splashMas"></div>
  <h1 class="title">星星數學宇宙</h1>
  <p class="sub">搭上火箭，到 20 個星座解數學任務，收集星星與徽章！</p>
  <button class="bigbtn" style="font-size:32px;padding:18px 40px" onclick="boot()">🚀 出發囉！</button>
</section>

<section class="screen" id="home">
  <div class="bar">
    <span class="pill wallet">⭐ <b id="w1">0</b></span>
    <span class="sp"></span>
    <button class="pill btn" onclick="openShop()">🛍️ 星星商店</button>
    <button class="pill btn" onclick="openAlbum()">📒 蒐集冊</button>
    <button class="pill btn" onclick="saveCodeUI()">💾 儲存進度</button>
    <button class="pill btn" onclick="loadCodeUI()">📂 開啟進度</button>
    <button class="pill btn" id="mBtn" onclick="toggleMusic()">🎵</button>
    <button class="pill btn" id="vBtn" onclick="toggleVoice()">🔊</button>
    <button class="pill btn" onclick="parentInfo()">❔</button>
  </div>
  <h1 class="title">星星數學宇宙</h1>
  <p class="sub">選一個星座出發吧！每個星座有 10 顆星球任務 🪐</p>
  <div class="cgrid" id="cgrid"></div>
</section>

<section class="screen" id="con">
  <div class="bar">
    <button class="pill btn" onclick="goHome()">⬅ 回銀河地圖</button>
    <span class="sp"></span>
    <span class="pill wallet">⭐ <b id="w2">0</b></span>
  </div>
  <div class="chead" id="chead"></div>
  <div class="path" id="path"></div>
  <div class="legend">
    <span style="background:#9ff0c9">基礎 1～2</span><span style="background:#9fd8ff">中階 3～5</span><span style="background:#ffd18a">困難 6～9</span><span style="background:#ff9ec7">超級挑戰 10</span>
  </div>
</section>

<section class="screen" id="quiz">
  <div class="bar">
    <button class="pill btn" onclick="quitQuiz()">⬅ 離開</button>
    <span class="sp"></span>
    <span class="pill" id="qinfo"></span>
    <span class="sp"></span>
    <span class="pill wallet">⭐ <b id="qst">0</b></span>
  </div>
  <div class="qwrap">
    <div class="dots" id="dots"></div>
    <div class="qcard">
      <div class="qtop"><div class="qt" id="qt"></div><button class="spk" onclick="readQ()" title="再聽一次">🔊</button></div>
      <div class="qv" id="qv"></div>
      <div class="opts" id="opts"></div>
      <div class="hint" id="hint"></div>
    </div>
  </div>
</section>

<section class="screen" id="result">
  <div class="rcard" id="rcard"></div>
</section>

<section class="screen" id="album">
  <div class="bar">
    <button class="pill btn" onclick="goHome()">⬅ 回銀河地圖</button>
    <span class="sp"></span>
    <span class="pill wallet">⭐ <b id="w3">0</b></span>
  </div>
  <h1 class="title" style="font-size:40px">📒 我的蒐集冊</h1>
  <div class="tabs"><button class="tab on" id="at0" onclick="albumTab(0)">🌌 星座徽章</button><button class="tab" id="at1" onclick="albumTab(1)">🎁 兌換徽章</button></div>
  <div class="panel" id="apanel"></div>
</section>

<section class="screen" id="shop">
  <div class="bar">
    <button class="pill btn" onclick="goHome()">⬅ 回銀河地圖</button>
    <span class="sp"></span>
    <button class="pill btn" onclick="openAlbum(1)">📒 看蒐集冊</button>
    <span class="pill wallet">⭐ <b id="w4">0</b></span>
  </div>
  <h1 class="title" style="font-size:40px">🛍️ 星星商店</h1>
  <p class="sub">用答對得到的星星，換可愛的徽章！</p>
  <div class="tabs" id="stabs"></div>
  <div class="panel"><div class="sgrid" id="sgrid"></div></div>
</section>

<div id="modal"><div class="mbox" id="mbox"></div></div>

<script>
'use strict';
/* ================= 基本工具 ================= */
const $=s=>document.querySelector(s);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const P=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const chance=p=>Math.random()<p;
let UID=0;
function near(n,steps=[1,-1,2,-2,10,-10],min=0){return shuf(steps).map(s=>n+s).filter(x=>x>=min&&x!==n)}
function Q(t,a,dist,h,v,s){
  a=String(a);const o=[a];
  for(const d of dist){if(typeof d==='number'&&(d<0||!isFinite(d)))continue;const x=String(d);if(!o.includes(x)&&o.length<4)o.push(x)}
  let k=1;const n=Number(a);
  while(o.length<4&&!isNaN(n)&&a.trim()!==''&&k<30){for(const c of [n+k,n-k]){const x=String(Math.round(c*10)/10);if(c>=0&&o.length<4&&!o.includes(x))o.push(x)}k++}
  return {t,a,o:shuf(o),h,v:v||'',s};
}
function sayify(h){
  return String(h).replace(/<span class="fr" title="([^"]+)">.*?<\/span>/g,'$1')
   .replace(/<[^>]+>/g,' ').replace(/[=＝]\s*[？?]/g,'等於多少').replace(/□/g,'多少').replace(/○/g,'圈圈')
   .replace(/[＋+]/g,'加').replace(/−/g,'減').replace(/×/g,'乘以').replace(/÷/g,'除以').replace(/[=＝]/g,'等於')
   .replace(/＞/g,'大於').replace(/＜/g,'小於').replace(/…/g,'餘').replace(/\s+/g,' ');
}
const EM=['🍎','🍓','🍌','🐟','⭐','🎈','🐞','🍩','🧁','🐥','🌸','🍪','🚗','🐠','🍊','🦋'];
const AN=['🐱','🐶','🐰','🐼','🐸','🐷','🐵','🐨','🦊','🐯'];
const ANN={'🐱':'小貓','🐶':'小狗','🐰':'小兔子','🐼':'貓熊','🐸':'青蛙','🐷':'小豬','🐵':'猴子','🐨':'無尾熊','🦊':'狐狸','🐯':'老虎'};

function poly(n,r=38,cx=50,cy=52){let p=[];for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1))}return p.join(' ')}

  return `<svg viewBox="0 0 100 100" width="90" height="90">${g}</svg>`}

function clockSVG(h,m){let s='';for(let i=1;i<=12;i++){const a=i*Math.PI/6;s+=`<text x="${(50+37*Math.sin(a)).toFixed(1)}" y="${(50-37*Math.cos(a)+4).toFixed(1)}" font-size="11" font-weight="900" text-anchor="middle" fill="#2b2350">${i}</text>`}

function barChart(labels,vals,col='#b69cff'){const mx=Math.max(...vals);const top=Math.ceil((mx+1)/2)*2;const H=160,base=180,w=46,gap=24;let g='';

function balanceSVG(L,Rt,tilt){const th=tilt*12*Math.PI/180;const lx=100-70*Math.cos(th),ly=60-70*Math.sin(th),rx=100+70*Math.cos(th),ry=60+70*Math.sin(th);

const G={
count(L){
  if(L===1){
    if(chance(.6)){const e=P(EM),n=R(3,12);return Q(`數一數，有幾個 ${e}？`,n,near(n,[1,-1,2,-2]),'用手指一個一個點著數，數過的不要再數喔！',em(e,n))}
    const n=R(2,29);return chance(.5)?Q(`${n} 的後面一個數是多少？`,n+1,near(n+1,[1,-1,-2,2]),`從 ${n} 再往後數 1 個就對了！`)
      :Q(`${n} 的前面一個數是多少？`,n-1,near(n-1,[1,2,-1,-2]),`從 ${n} 倒著往前數 1 個喔！`)}
  if(L===2){
    if(chance(.55)){const st=P([2,5,10]);const a=R(0,Math.floor((100-st*4)/st))*st;const s=[a,a+st,a+2*st,a+3*st],ans=a+4*st;
      return Q('找找看，下一個數是多少？',ans,near(ans,[1,-1,st,-2*st,2]),'看看每一次都多了多少？用一樣的方法往後跳！',seq([...s,'?']),`找找看，${s.join('、')}，下一個數是多少？`)}
    const n=R(11,89),k=P([1,10]);return chance(.5)?Q(`比 ${n} 多 ${k} 的數是多少？`,n+k,near(n+k,[1,-1,10,-10,9]),k===1?'往後數 1 個！':'多 10 就是十位多 1，個位不變喔！')
      :Q(`比 ${n} 少 ${k} 的數是多少？`,n-k,near(n-k,[1,-1,10,-10,-9]),k===1?'往前數 1 個！':'少 10 就是十位少 1，個位不變喔！')}
  if(L===3){
    if(chance(.5)){const st=P([5,10,50,100]);const a=R(1,Math.floor((1000-st*4)/st))*st;const s=[a,a+st,a+2*st,a+3*st],ans=a+4*st;
      return Q('找找看，下一個數是多少？',ans,near(ans,[st,-2*st,10,-10,1,100]),'每一次都多一樣多，先找出多了多少！',seq([...s,'?']),`找找看，${s.join('、')}，下一個數是多少？`)}

    const n=R(101,899),k=P([10,100]);return Q(`比 ${n} 多 ${k} 的數是多少？`,n+k,near(n+k,[10,-10,100,-100,1]),k===10?'十位多 1，其他位不變！':'百位多 1，其他位不變！')}
  const t=R(1,4);
  if(t===1){const st=P([100,1000,500,50]);const a=R(1,Math.floor((10000-st*4)/st))*st;const s=[a,a+st,a+2*st,a+3*st],ans=a+4*st;
    return Q('找找看，下一個數是多少？',ans,near(ans,[st,-2*st,100,-100,1000,10]),'先算算看每一次多多少！',seq([...s,'?']),`找找看，${s.join('、')}，下一個數是多少？`)}
  if(t===2){const s=R(1,8)*1000+999;return Q(`${s} 的後面一個數是多少？`,s+1,[s+10,s+1000,s+2-1000+1000-1,s+101,s+1001].filter(x=>x!==s+1),'9 再加 1 會一路進位喔，小心看清楚！')}
  if(t===3){const s=R(2,9)*1000;return Q(`${s} 的前面一個數是多少？`,s-1,[s-10,s-100,s+1,s-1001,s-11],'倒著往前數 1 個，個位、十位、百位都會變成 9 喔！')}
  const s=R(1001,9897);return Q(`哪一個數在 ${s} 和 ${s+2} 的中間？`,s+1,[s+10,s+3,s-1,s+100],'從小的數往後數 1 個！')},

add(L){
  if(L===1){
    if(chance(.6)){const a=R(1,6),b=R(1,10-a),e=P(EM);return Q(`${a} + ${b} = ？`,a+b,near(a+b,[1,-1,2,-2]),`先數 ${a} 個 ${e}，再接著往後數 ${b} 個！`,`<div class="emos">${em(e,a).slice(18,-6)}<i class="op">＋</i>${em(e,b).slice(18,-6)}</div>`)}

  const a=R(105,400),b=R(105,400),c=R(105,400);return Q(`${a} + ${b} + ${c} = ？`,a+b+c,near(a+b+c,[10,-10,100,-100,1]),`先算 ${a} + ${b}，再把答案加上 ${c}！`)},

area(L){
  if(L===1){const W=6,H=4;const set=new Set();let x=R(1,3),y=R(1,2);const n=R(4,9);set.add(x+','+y);let g=0;

    const s=R(2,9);return Q(`正方形的周長是 ${s*4} 公分，一邊是幾公分？`,s,[s*2,s*4,s+1,s*4-4].filter(x=>x!==s),`4 條邊一樣長，想一想：4 × 幾 = ${s*4}？`,shapeSVG('sq'))}

logic(L){
  if(L===1){const pool=shuf(['🔴','🔵','💛','💚','⭐','🌙','🍀','🍄']);const [A,B,C]=pool;const pats=[[A,B],[A,A,B],[A,B,B],[A,B,C]];const p=P(pats);

    return Q('照著規律排，下一個是什麼？',ans,[A,B,C,pool[3]].filter(x=>x!==ans),'找找看哪幾個一直重複出現？',seq([...s,'?']).replace(/<em>，<\/em>/g,''))}
  if(L===2){const st=P([2,5,10,-1,-2,3]);const a=st<0?R(20,60):R(1,40);const s=[0,1,2,3].map(i=>a+i*st);const ans=a+4*st;

    if(t===1){const a=R(3,9),c=R(a+3,20);return Q(`□ + ${a} = ${c}，□ 是多少？`,c-a,near(c-a,[1,-1,2,a]),`想一想：哪個數加上 ${a} 會變成 ${c}？可以用 ${c} − ${a}！`)}

  const t=R(1,4);
  if(t===1){const a=R(1,5);const s=[a,a+1,a+3,a+6,a+10];return Q('找找看，下一個數是多少？',a+15,[a+14,a+16,a+20,a+13],'每次多的數也在變喔：+1、+2、+3…',seq([...s,'?']),`找找看，${s.join('、')}，下一個數是多少？`)}
  if(t===2){const k=R(3,9),n=R(3,9);return Q(`□ × ${k} = ${n*k}，□ 是多少？`,n,near(n,[1,-1,2,-2]),`背 ${k} 的乘法，看看幾個 ${k} 是 ${n*k}！`)}

const AU={ctx:null};
function audio(){if(!AU.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.connect(AU.ctx.destination);AU.mus=AU.ctx.createGain();AU.mus.gain.value=S.music?1:0;AU.mus.connect(AU.master);AU.duck=AU.ctx.createGain();AU.duck.connect(AU.mus);AU.sfx=AU.ctx.createGain();AU.sfx.gain.value=.5;AU.sfx.connect(AU.master)}
  if(AU.ctx.state==='suspended')AU.ctx.resume();return AU.ctx}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function note(m,t,d,type,vol,dest){const c=AU.ctx;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=mtof(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.02);g.gain.exponentialRampToValueAtTime(0.0008,t+d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+0.05)}
const MEL=[64,67,69,67,64,62,60,-1, 62,64,67,64,62,-1,-1,-1, 60,64,69,67,64,-1,60,62, 69,67,65,64,62,-1,-1,-1, 67,69,72,69,67,64,67,-1, 69,72,74,72,69,-1,65,67, 67,64,62,64,67,69,71,-1, 72,-1,67,-1,60,-1,-1,-1];
const CH=[[48,52,55],[43,47,50],[45,48,52],[41,45,48],[48,52,55],[41,45,48],[43,47,50],[48,52,55]];
let mStep=0,mNext=0,mTimer=null;
function startMusic(){if(!audio()||mTimer)return;mNext=AU.ctx.currentTime+0.1;mTimer=setInterval(()=>{const c=AU.ctx,e=0.29;while(mNext<c.currentTime+0.25){const bar=Math.floor(mStep/8)%8,b=mStep%8;const ch=CH[bar];
    const m=MEL[mStep%64];if(m>0)note(m+12,mNext,e*1.8,'triangle',0.05,AU.duck);
    if(b===0||b===4)note(ch[0]-12,mNext,e*3,'sine',0.09,AU.duck);
    if(b%2===1)note(ch[(b>>1)%3]+12,mNext,e*1.2,'sine',0.025,AU.duck);
    mNext+=e;mStep++}},60)}
function setDuck(on){if(AU.ctx)AU.duck.gain.setTargetAtTime(on?0.25:1,AU.ctx.currentTime,0.15)}
function sfx(k){if(!audio())return;const t=AU.ctx.currentTime;const d=AU.sfx;
  if(k==='ok')[72,76,79,84].forEach((m,i)=>note(m,t+i*0.07,0.35,'sine',0.35,d));
  if(k==='no'){note(57,t,0.25,'triangle',0.3,d);note(53,t+0.15,0.35,'triangle',0.3,d)}
  if(k==='tap')note(84,t,0.08,'sine',0.2,d);
  if(k==='win')[60,64,67,72,76,79,84,88].forEach((m,i)=>note(m,t+i*0.09,0.5,'triangle',0.3,d));
  if(k==='coin'){note(83,t,0.1,'square',0.12,d);note(88,t+0.08,0.35,'square',0.12,d)}}

function renderQ(first){const q=QZ.qs[QZ.i];QZ.tries=0;QZ.busy=false;
  $('#dots').innerHTML=QZ.qs.map((_,i)=>`<i class="${i===QZ.i?'cur':''}">${QZ.marks[i]===1?'⭐':QZ.marks[i]===0?'💫':i+1}</i>`).join('');
  $('#qt').innerHTML=`<span style="color:#b39cff">第 ${QZ.i+1} 題</span>　${q.t}`;$('#qv').innerHTML=q.v;
  const o=$('#opts');o.className='opts'+(q.o.length===3?' three':'');
  o.innerHTML=q.o.map((x,k)=>`<button class="opt" data-k="${k}">${x}</button>`).join('');
  o.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b));
  const h=$('#hint');h.className='hint';h.innerHTML='';
  const intro=first?`${CON[QZ.c].n}第 ${QZ.p+1} 顆星球，任務開始囉！第一題：`:'';
  say(intro+sayify(q.s||q.t))}
function readQ(){const q=QZ&&QZ.qs[QZ.i];if(q)say(sayify(q.s||q.t))}
function answer(btn){if(QZ.busy)return;const q=QZ.qs[QZ.i];const val=q.o[+btn.dataset.k];
  if(val===q.a){QZ.busy=true;btn.classList.add('right');sfx('ok');QZ.marks[QZ.i]=1;QZ.stars++;S.wallet++;S.earned++;save();flyStar(btn);
    say(QZ.tries?P(PRAISE2):P(PRAISE));setTimeout(nextQ,1500);return}
  QZ.tries++;btn.classList.add('wrong');btn.disabled=true;sfx('no');
  if(QZ.tries===1){const h=$('#hint');h.innerHTML=mascotSVG()+`<span>💡 小提示：${q.h}</span>`;h.className='hint on';say(P(OOPS)+'小提示：'+sayify(q.h))}
  else{QZ.busy=true;QZ.marks[QZ.i]=0;document.querySelectorAll('#opts .opt').forEach((b,k)=>{if(q.o[k]===q.a)b.classList.add('right');else b.disabled=true});
    const h=$('#hint');h.innerHTML=mascotSVG()+`<span>答案是 <b style="font-size:1.2em">${q.a}</b> 喔！沒關係，下一題加油！</span>`;h.className='hint on';
    say(`答案是 ${sayify(q.a)} 喔！沒關係，我們下一題一起加油！`);setTimeout(nextQ,3200)}}
function nextQ(){QZ.i++;if(QZ.i>=QZ.qs.length)return finish();renderQ(false)}
function flyStar(btn){const r=btn.getBoundingClientRect(),t=$('#qst').getBoundingClientRect();const s=document.createElement('div');s.className='fly';s.textContent='⭐';s.style.left=(r.left+r.width/2-22)+'px';s.style.top=(r.top)+'px';document.body.appendChild(s);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.left=(t.left)+'px';s.style.top=(t.top-6)+'px';s.style.transform='scale(.6)'}));setTimeout(()=>{s.remove();updWallet()},950)}
function quitQuiz(){modal(`<h2>要離開這顆星球嗎？</h2><p style="text-align:center">已經拿到的星星會留著喔！<br>但是要重新挑戰才能過關。</p><div class="btns"><button class="bigbtn b2" onclick="closeModal()">繼續玩</button><button class="bigbtn" onclick="closeModal();openCon(QZ.c)">離開</button></div>`)}
function confetti(){const cs=['#ff7eb6','#ffd84d','#5fe3c0','#7cc8ff','#a78bfa'];for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.top=(-10-Math.random()*30)+'px';d.style.background=cs[i%5];d.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}}
function finish(){const {c,p,stars}=QZ;const key=c+'-'+p;const wasPassed=best(c,p)>=PASS;if(stars>best(c,p))S.best[key]=stars;save();
  const pass=stars>=PASS;const newBadge=pass&&!wasPassed;
  let h=`<h2 style="margin:0">${CON[c].n}・${PNAME[p]}</h2><div class="rstars">${Array.from({length:10},(_,i)=>`<i style="animation-delay:${i*.08}s">${i<stars?'⭐':'☆'}</i>`).join('')}</div>
   <div style="font-size:24px;font-weight:900">這次拿到 ${stars} 顆星星！</div>`;
  if(pass)h+=`<div class="bigbadge">${planetSVG(c,p)}</div><div style="font-size:22px;font-weight:900;color:#d14d8c">${newBadge?'🎉 得到新徽章：':'🏅 已收集的徽章：'}${CON[c].n}・${PNAME[p]}</div>`;
  else h+=`<p style="font-size:20px">再拿 ${PASS-stars} 顆星星就能過關，得到星球徽章喔！<br>拿到 ${PASS} 顆以上星星就過關！</p>`;
  h+=`<div class="btns">${pass&&p<9?`<button class="bigbtn" onclick="startQuiz(${c},${p+1})">下一顆星球 ➜</button>`:''}<button class="bigbtn b2" onclick="startQuiz(${c},${p})">再玩一次</button><button class="bigbtn b3" onclick="openCon(${c})">回到${CON[c].n}</button></div>`;
  $('#rcard').innerHTML=h;show('result');
  if(pass){sfx('win');confetti()}
  const msg=stars===10?'哇～十題全部答對！你是超級數學小天才！':pass?(newBadge?`太棒了！你過關了，還得到了${PNAME[p]}的徽章！`:'過關囉！你越來越厲害了！'):'好可惜喔～差一點點就過關了！我們再挑戰一次好不好？';
  setTimeout(()=>say(msg+(pass&&p===9&&newBadge?`恭喜你完成了整個${CON[c].n}！`:'')),500)}

/* ================= 蒐集冊 ================= */
let aTab=0;
function openAlbum(t){if(t!==undefined)aTab=t;show('album');albumTab(aTab)}
function albumTab(t){aTab=t;$('#at0').classList.toggle('on',t===0);$('#at1').classList.toggle('on',t===1);let h='';
  if(t===0){let tot=0;h=CON.map((c,ci)=>{let n=0;const row=Array.from({length:10},(_,p)=>{const ok=best(ci,p)>=PASS;if(ok)n++;return `<button class="bslot ${ok?'':'no'}" onclick="badgeInfo(0,${ci},${p})">${planetSVG(ci,p)}</button>`}).join('');tot+=n;
      return `<div class="sect"><h3><span style="width:38px;height:38px;display:inline-block">${miniCon(ci)}</span>${c.n}<small>${c.t}・${n}/10</small></h3><div class="brow">${row}</div></div>`}).join('');
    h=`<p class="sub" style="text-align:center">已收集 ${tot} / 200 個星球徽章</p>`+h}
  else{let tot=0;h=SERIES.map((s,si)=>{let n=0;const row=Array.from({length:10},(_,i)=>{const ok=S.own[si+'-'+i];if(ok)n++;return `<button class="bslot ${ok?'':'no'}" onclick="badgeInfo(1,${si},${i})">${shopArt(si,i)}</button>`}).join('');tot+=n;
      return `<div class="sect"><h3>${s.ic} ${s.n}<small>${n}/10</small></h3><div class="brow">${row}</div></div>`}).join('');
    h=`<p class="sub" style="text-align:center">已兌換 ${tot} / ${SERIES.length*10} 個徽章　<button class="pill btn" onclick="openShop()">🛍️ 去商店</button></p>`+h}
  $('#apanel').innerHTML=h}
function badgeInfo(type,a,b){sfx('tap');let art,name,st;
  if(type===0){art=planetSVG(a,b);name=`${CON[a].n}・${PNAME[b]}`;const v=best(a,b);st=v>=PASS?`已收集！最佳成績 ⭐ ${v}/10`:`到${CON[a].n}第 ${b+1} 顆星球拿到 ${PASS} 顆星星就能得到！`}
  else{art=shopArt(a,b);name=shopName(a,b);st=S.own[a+'-'+b]?'已兌換！好可愛！':`到星星商店用 ⭐ ${SERIES[a].cost[b]} 顆星星兌換`}
  const own=type===0?best(a,b)>=PASS:S.own[a+'-'+b];
  modal(`<div class="bigbadge" style="${own?'':'filter:grayscale(1) brightness(.6)'}">${art}</div><h2 style="margin:6px 0">${own?name:'？？？'}</h2><p style="text-align:center">${st}</p><button class="bigbtn" onclick="closeModal()">好的</button>`);
  if(own)say(name)}

/* ================= 商店 ================= */
let sTab=0;
function openShop(){show('shop');$('#stabs').innerHTML=SERIES.map((s,i)=>`<button class="tab ${i===sTab?'on':''}" onclick="shopTab(${i})">${s.ic} ${s.n}</button>`).join('');shopTab(sTab)}
function shopTab(i){sTab=i;document.querySelectorAll('#stabs .tab').forEach((b,k)=>b.classList.toggle('on',k===i));const s=SERIES[i];
  $('#sgrid').innerHTML=s.cost.map((c,k)=>{const own=S.own[i+'-'+k];return `<div class="sitem ${own?'have':''}"><div class="art">${shopArt(i,k)}</div><div class="nm">${shopName(i,k)}</div>
   ${own?'<div class="owned">✔ 已擁有</div>':`<button class="buy" ${S.wallet<c?'disabled':''} onclick="buy(${i},${k})">⭐ ${c}</button>${S.wallet<c?`<div style="font-size:13px;color:#999;margin-top:4px">還差 ${c-S.wallet} 顆</div>`:''}`}</div>`}).join('')}
function buy(si,i){const c=SERIES[si].cost[i];if(S.wallet<c)return;sfx('tap');
  modal(`<div class="bigbadge">${shopArt(si,i)}</div><h2 style="margin:6px 0">${shopName(si,i)}</h2><p style="text-align:center">要用 ⭐ ${c} 顆星星換這個徽章嗎？<br>（你有 ${S.wallet} 顆）</p><div class="btns"><button class="bigbtn b2" onclick="closeModal()">再想想</button><button class="bigbtn" onclick="doBuy(${si},${i})">換！</button></div>`);
  say(`要用 ${c} 顆星星，換${shopName(si,i)}嗎？`)}
function doBuy(si,i){const c=SERIES[si].cost[i];if(S.wallet<c||S.own[si+'-'+i])return closeModal();S.wallet-=c;S.own[si+'-'+i]=1;save();sfx('coin');setTimeout(()=>sfx('win'),200);confetti();closeModal();updWallet();shopTab(si);
  const n=SERIES[si].cost.filter((_,k)=>S.own[si+'-'+k]).length;say(n===10?`哇！你收集完整套${SERIES[si].n}了！太厲害了！`:`耶～換到${shopName(si,i)}了！已經放進蒐集冊囉！`)}

/* ================= 視窗 ================= */
function modal(h){$('#mbox').innerHTML=h;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
function parentInfo(){modal(`<h2 style="margin-top:0">給爸爸媽媽的說明</h2><p>
• 20 個星座對應 108 課綱國小一～三年級數學主題，每個星座 10 顆星球、每顆 10 題。<br>
• 難度：第 1～2 顆基礎（約一年級）、3～5 中階（約二年級）、6～9 困難（約二下～三上）、第 10 顆超級挑戰（約三年級下）。<br>
• 答錯不扣分：第一次答錯會顯示提示並可再答；錯兩次會公布答案、該題沒有星星。<br>
• 一顆星球拿到 ${PASS} 顆以上星星就過關，得到星球徽章並解鎖下一顆。重玩也能再賺星星。<br>
• 星星可在商店兌換 11 個系列的徽章，每系列 10 個、合計 200 顆星星。<br>
• 建議使用 Microsoft Edge，有最自然的中文語音。題目每次隨機出題。<br>
• 進度存在這台裝置的瀏覽器裡。換裝置時，先按「💾 儲存進度」取得進度碼，再到新裝置按「📂 開啟進度」貼上即可。</p>
<div class="btns"><button class="bigbtn b3" onclick="resetAll()">清除全部進度</button><button class="bigbtn" onclick="closeModal()">知道了</button></div>`)}
/* ================= 進度碼：換裝置也能接著玩 ================= */
const B36='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function chk(s){let h=7;for(const ch of s)h=(h*31+ch.charCodeAt(0))%1296;return B36[Math.floor(h/36)]+B36[h%36]}
function makeCode(){let b='';for(let c=0;c<CON.length;c++)for(let p=0;p<10;p++){const v=best(c,p);b+=v===10?'A':String(v)}b=b.replace(/0+$/,'');
  let bits='';for(let si=0;si<SERIES.length;si++)for(let i=0;i<10;i++)bits+=S.own[si+'-'+i]?'1':'0';
  let hex='';bits=bits.padEnd(Math.ceil(bits.length/4)*4,'0');for(let i=0;i<bits.length;i+=4)hex+=parseInt(bits.slice(i,i+4),2).toString(16).toUpperCase();hex=hex.replace(/0+$/,'');
  const body=`${S.wallet.toString(36).toUpperCase()}-${S.earned.toString(36).toUpperCase()}-${b||'0'}-${hex||'0'}`;
  return `GM1-${body}-${chk(body)}`}
function readCode(code){code=String(code).replace(/\s+/g,'').toUpperCase();const m=code.match(/^GM1-([0-9A-Z]+)-([0-9A-Z]+)-([0-9A]+)-([0-9A-F]+)-([0-9A-Z]{2})$/);if(!m)return null;
  const body=`${m[1]}-${m[2]}-${m[3]}-${m[4]}`;if(chk(body)!==m[5])return null;
  const d={wallet:parseInt(m[1],36),earned:parseInt(m[2],36),best:{},own:{}};if(isNaN(d.wallet)||isNaN(d.earned)||m[3].length>CON.length*10)return null;
  [...m[3]].forEach((ch,k)=>{const v=ch==='A'?10:+ch;if(v>0)d.best[Math.floor(k/10)+'-'+(k%10)]=v});
  let bits='';for(const h of m[4])bits+=parseInt(h,16).toString(2).padStart(4,'0');
  for(let k=0;k<Math.min(bits.length,SERIES.length*10);k++)if(bits[k]==='1')d.own[Math.floor(k/10)+'-'+(k%10)]=1;
  return d}
function progSummary(d){const badges=Object.values(d.best).filter(v=>v>=PASS).length;return `⭐ ${d.wallet} 顆星星、🏅 ${badges} 個星球徽章、🎁 ${Object.keys(d.own).length} 個兌換徽章`}
const codeBox='width:100%;min-height:96px;font-size:20px;font-family:Consolas,monospace;border:3px dashed #b69cff;border-radius:14px;padding:10px;color:#2b2350;background:#fff;word-break:break-all;resize:vertical';
function saveCodeUI(){sfx('tap');const code=makeCode();
  modal(`<h2 style="margin-top:0">💾 儲存進度</h2><p>這是你的進度碼。把它複製起來，用 LINE、訊息或寫在紙上保存；換一台電腦或平板時，按「📂 開啟進度」貼上，就能接著玩！</p>
  <textarea id="codeOut" readonly style="${codeBox}">${code}</textarea>
  <p style="text-align:center;font-size:17px">目前進度：${progSummary(S)}</p>
  <div id="copyMsg" style="min-height:26px;font-weight:900;color:#1f9d6a"></div>
  <div class="btns"><button class="bigbtn" id="copyBtn" onclick="copyCode()">📋 複製進度碼</button><button class="bigbtn b2" onclick="closeModal()">好了</button></div>`);
  say('這是你的進度碼！把它複製起來保存好，換裝置的時候就可以接著玩喔！')}
function copyCode(){const ta=$('#codeOut');const ok=()=>{$('#copyMsg').textContent='✔ 已複製！可以貼到 LINE 或記事本保存';sfx('coin')};
  const fallback=()=>{ta.focus();ta.select();let done=false;try{done=document.execCommand('copy')}catch(e){}
    if(done)ok();else $('#copyMsg').textContent='已幫你選取進度碼，請按 Ctrl+C（手機請長按）複製'};
  try{navigator.clipboard.writeText(ta.value).then(ok,fallback)}catch(e){fallback()}}
function loadCodeUI(){sfx('tap');
  modal(`<h2 style="margin-top:0">📂 開啟進度</h2><p>把之前保存的進度碼貼在下面，按「開啟」。</p>
  <textarea id="codeIn" placeholder="例如 GM1-…" style="${codeBox}"></textarea>
  <div id="loadMsg" style="min-height:26px;font-weight:900;color:#d14d6d;margin-top:6px"></div>
  <div class="btns"><button class="bigbtn b2" onclick="closeModal()">取消</button><button class="bigbtn" onclick="checkCode()">開啟</button></div>`);
  setTimeout(()=>{const t=$('#codeIn');if(t)t.focus()},50);say('把進度碼貼上來，就可以接著玩囉！')}
let pendingLoad=null;
function checkCode(){const d=readCode($('#codeIn').value);if(!d){sfx('no');$('#loadMsg').textContent='這個進度碼好像不對喔，請檢查有沒有少複製到字';say('這個進度碼好像不太對喔，再檢查一次！');return}
  pendingLoad=d;modal(`<h2 style="margin-top:0">找到進度了！</h2><p style="text-align:center">${progSummary(d)}</p>
  <p style="text-align:center;font-size:17px;color:#a05">這台裝置現在的進度（${progSummary(S)}）會被換掉喔！</p>
  <div class="btns"><button class="bigbtn b2" onclick="loadCodeUI()">再想想</button><button class="bigbtn" onclick="applyLoad()">換成這個進度</button></div>`)}
function applyLoad(){if(!pendingLoad)return closeModal();S.wallet=pendingLoad.wallet;S.earned=pendingLoad.earned;S.best=pendingLoad.best;S.own=pendingLoad.own;pendingLoad=null;save();closeModal();sfx('win');confetti();goHome();say('進度開啟成功！歡迎回來，我們繼續冒險吧！')}
function resetAll(){modal(`<h2>確定要清除全部進度嗎？</h2><p style="text-align:center">星星、徽章都會不見，而且不能復原喔！</p><div class="btns"><button class="bigbtn b2" onclick="parentInfo()">不要</button><button class="bigbtn" onclick="S={wallet:0,earned:0,best:{},own:{},music:S.music,voice:S.voice};save();closeModal();goHome()">確定清除</button></div>`)}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
updWallet();
</script>
</body>
</html>
